version: "3"

services:
  geek-market:
    build: .
    ports:
      - "8080:8080"
    network_mode: host

  maildev:
    image: maildev/maildev
    ports:
      - "1081:1080"
      - "25:25"

  redis:
    image: 'bitnami/redis:latest'
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - REDIS_PORT_NUMBER=7000
    ports:
      - "9999:7000"
